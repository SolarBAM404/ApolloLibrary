name: Gradle Publish and JReleaser Deploy

on:
  push:
    branches:
      - rewrite

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message for version pattern
        id: check_commit
        run: |
          if [[ "${{ github.event.head_commit.message }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "match=true" >> $GITHUB_OUTPUT
          else
            echo "match=false" >> $GITHUB_OUTPUT
          fi

      # Configure build steps as you'd normally do
      
      - name: Change directory
        run: cd Apollo-Library

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: gradle

      # Post JARs to Maven Central

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: Apollo-Library

      - name: Release to Maven Central
        working-directory: Apollo-Library
        if: steps.check_commit.outputs.match == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GPG_TTY=$(tty)
          git config user.name "${{ github.event.head_commit.committer.name }}"
          git config user.email "${{ github.event.head_commit.committer.email }}"
          ./gradlew publish

      - name: Run Gradle clean, publish, and jreleaserDeploy
        if: steps.check_commit.outputs.match == 'true'
        run: ./gradlew jreleaserDeploy
        working-directory: Apollo-Library
        
